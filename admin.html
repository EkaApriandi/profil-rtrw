<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Profil RT/RW</title>
    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="admin.css">
    
    <!-- Memuat Supabase (Wajib dimuat sebelum admin.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Library untuk Generate QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="container">
    <div id="login-section" class="card login-card">
        <h2 style="text-align: center; margin-bottom: 20px;">Login Admin</h2>
        <div id="login-error" class="error-text"></div>
        <input type="email" id="email" placeholder="Email Admin" required>
        <input type="password" id="password" placeholder="Passphrase" required>
        <button id="btn-login" onclick="login()">Masuk</button>
    </div>

    <div id="dashboard-section" style="display: none;">
        <div class="card header-flex">
            <h2>Panel Pengelolaan Data RT/RW</h2>
            <div class="action-buttons">
                <button class="btn-success btn-small" onclick="bukaModalTambah()">+ Tambah Data</button>
                <button class="btn-danger btn-small" onclick="logout()">Keluar</button>
            </div>
        </div>
        
        <div class="card table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>Jabatan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL EDIT / TAMBAH DATA -->
<div id="edit-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3 id="modal-title">Form Data Pengurus</h3>
        
        <label>ID Pengurus (Tanpa Spasi, contoh: RT1-RW2)</label>
        <input type="text" id="edit-id" placeholder="Hanya huruf, angka, dan strip (-)">
        
        <label>Nama</label>
        <input type="text" id="edit-nama">
        
        <label>Jabatan</label>
        <input type="text" id="edit-jabatan">
        
        <label>Masa Jabatan</label>
        <input type="text" id="edit-masa">
        
        <label>Nomor HP / WhatsApp</label>
        <input type="text" id="edit-nohp">
        
        <label>Deskripsi Tugas</label>
        <textarea id="edit-deskripsi" rows="3"></textarea>
        
        <label>Upload Foto Profil (Opsi)</label>
        <input type="file" id="edit-foto" accept="image/*">
        
        <div class="modal-actions">
            <button id="btn-simpan" onclick="simpanData()">Simpan</button>
            <button class="btn-danger" onclick="tutupModal()">Batal</button>
        </div>
    </div>
</div>

<!-- MODAL UNTUK QR CODE -->
<div id="qr-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 300px; position: relative;">
        <span onclick="tutupModalQR()" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer;">&times;</span>
        <h3 id="qr-title" style="margin-bottom: 15px; color: #1e3a8a;">QR Code</h3>
        
        <!-- Tempat QR Code akan digambar -->
        <div id="qr-container" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
        
        <p id="qr-link" style="font-size: 11px; color: #64748b; margin-bottom: 20px; word-wrap: break-word;"></p>
        
        <!-- Dua tombol aksi: Cetak dan Unduh -->
        <div style="display: flex; gap: 10px; width: 100%;">
            <button onclick="cetakQR()" style="background-color: #3b82f6; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; font-size: 13px;">
                Cetak
            </button>
            <button onclick="downloadQR()" style="background-color: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; font-size: 13px;">
                Unduh (PNG)
            </button>
        </div>
    </div>
</div>

<!-- Elemen Toast Notification -->
<div id="toast">Notifikasi</div>

<!-- Menghubungkan file JavaScript -->
<script src="admin.js"></script>
</body>
</html>
